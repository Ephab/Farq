services:
  web:
    build: .
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/farq.db
      HERMES_URL: http://hermes:8642
      HERMES_EMAIL_URL: http://hermes-email:8643
      HERMES_API_KEY: ${HERMES_API_KEY:?Run scripts/setup.ps1 or set a strong HERMES_API_KEY in .env}
      HERMES_MODEL: ${HERMES_MODEL:-gemini-3.8-flash}
      HERMES_PROVIDER: ${HERMES_PROVIDER:-gemini}
      FARQ_INTERNAL_TOKEN: ${FARQ_INTERNAL_TOKEN:-farq-internal-dev}
      OPPORTUNITY_SYNC_ENABLED: ${OPPORTUNITY_SYNC_ENABLED:-true}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      OUTLOOK_CLIENT_ID: ${OUTLOOK_CLIENT_ID:-}
      OUTLOOK_TENANT: ${OUTLOOK_TENANT:-consumers}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      OUTLOOK_APP_ORIGIN: ${OUTLOOK_APP_ORIGIN:-http://localhost:5173}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:5173/api/outlook/callback}
      FARQ_TOKEN_ENCRYPTION_KEY: ${FARQ_TOKEN_ENCRYPTION_KEY:-}
      OUTLOOK_SYNC_ENABLED: ${OUTLOOK_SYNC_ENABLED:-false}
      HF_HOME: /data/model-cache
    volumes:
      - farq-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10m

  hermes:
    image: nousresearch/hermes-agent:v2026.9.14
    command: gateway
    working_dir: /workspace
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 8642
      API_SERVER_KEY: ${HERMES_API_KEY:?Run scripts/setup.ps1 or set a strong HERMES_API_KEY in .env}
      HERMES_ENABLE_PROJECT_PLUGINS: "1"
      HERMES_MODEL: ${HERMES_MODEL:-gemini-3.8-flash}
      FARQ_API_INTERNAL_URL: http://api:8000
      FARQ_INTERNAL_TOKEN: ${FARQ_INTERNAL_TOKEN:-farq-internal-dev}
    volumes:
      - hermes-data:/opt/data
      - ./services/hermes/config.yaml:/opt/data/config.yaml:ro
      - ./services/hermes/SOUL.md:/opt/data/SOUL.md:ro
      - ./.hermes/plugins/farq:/opt/data/plugins/farq:ro
      - ./.hermes/skills/farq-student-coach:/opt/data/skills/farq-student-coach:ro
      - ./.hermes/skills/farq-onboarding:/opt/data/skills/farq-onboarding:ro
      - ./.hermes/skills/farq-quiz:/opt/data/skills/farq-quiz:ro
      - ./.hermes/skills/farq-slides:/opt/data/skills/farq-slides:ro
      - ./.hermes/skills/farq-project-coach:/opt/data/skills/farq-project-coach:ro
      - ./.hermes/skills/farq-team-coach:/opt/data/skills/farq-team-coach:ro
      # Onboarding folder scans only see paths inside this container. To let Hermes index
      # a host folder, mount it read-only and type the container path, e.g.:
      # - C:/Users/me/Projects:/scan/projects:ro
    ports:
      - "8642:8642"
    depends_on:
      api:
        condition: service_started

  hermes-email:
    image: nousresearch/hermes-agent:v2026.9.14
    command: gateway
    working_dir: /opt/data
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 8643
      API_SERVER_KEY: ${HERMES_API_KEY:?Set HERMES_API_KEY}
      HERMES_ENABLE_PROJECT_PLUGINS: "0"
    volumes:
      - hermes-email-data:/opt/data
      - ./services/hermes/email-config.yaml:/opt/data/config.yaml:ro

volumes:
  farq-data:
  hermes-data:
  hermes-email-data:
