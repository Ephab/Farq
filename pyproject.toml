[project]
name = "waypoint"
version = "0.1.0"
description = "Waypoint API and local email classification"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.43",
  "pydantic-settings==2.10.1",
  "httpx==0.28.1",
  "python-pptx==1.0.2",
  "python-docx==1.2.0",
  "pypdf[crypto]==6.1.1",
  "python-multipart==0.0.20",
  "pywin32>=311,<312; sys_platform == 'win32'",
  "cryptography>=45,<51",
  "laya==0.3.20",
  "transformers==4.57.6",
  "huggingface-hub==0.36.2",
  "safetensors==0.7.0",
  "numpy==1.26.4",
  "torch==2.8.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "playwright>=1.47,<2",
]

[project.optional-dependencies]
cuda = ["torch==2.8.0; sys_platform != 'darwin'"]
cpu = ["torch==2.8.0; sys_platform != 'darwin'"]

[dependency-groups]
dev = ["pytest==8.4.2"]
benchmark = ["psutil>=7,<8"]

[tool.uv]
package = false
required-version = ">=0.12.0"
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin'", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
