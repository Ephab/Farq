[project]
name = "waypoint-collaboration"
version = "0.1.0"
description = "Independent central Waypoint collaboration service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.43",
  "pydantic-settings==2.10.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "PyJWT[crypto]>=2.12,<3",
  "python-docx==1.2.0",
  "python-multipart==0.0.20",
  "pypdf==6.0.0",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
