model:
  default: gemini-3.8-flash
  provider: gemini
  base_url: https://generativelanguage.googleapis.com/v1beta

platform_toolsets:
  api_server:
    - farq
    - memory
    - skills

plugins:
  enabled:
    - farq
  disabled: []
  entries:
    farq:
      allow_tool_override: false

agent:
  disabled_toolsets:
    - bfl
  # Fail fast: Farq's API already falls back to the next model (app.hermes.FALLBACK_CHAIN),
  # so Hermes' own retries on an exhausted model only add minutes of waiting.
  api_max_retries: 1

tools:
  tool_search:
    # Farq exposes only a handful of tools; load them directly instead of spending a
    # model round trip on tool_search before every Farq tool call.
    enabled: "off"

gateway:
  api_server:
    enabled: true
    host: 0.0.0.0
    port: 8642
    model_name: farq-hermes
    max_concurrent_runs: 8
