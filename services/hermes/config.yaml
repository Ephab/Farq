model:
  default: gemini-3.8-flash
  provider: gemini
  base_url: https://generativelanguage.googleapis.com/v1beta

platform_toolsets:
  api_server:
    - waypoint
    - memory
    - skills

plugins:
  enabled:
    - waypoint
  disabled: []
  entries:
    waypoint:
      allow_tool_override: false

agent:
  disabled_toolsets:
    - bfl
  # Fail fast: Waypoint's API already falls back to the next model (app.hermes.FALLBACK_CHAIN),
  # so Hermes' own retries on an exhausted model only add minutes of waiting.
  api_max_retries: 1

tools:
  tool_search:
    # Waypoint exposes only a handful of tools; load them directly instead of spending a
    # model round trip on tool_search before every Waypoint tool call.
    enabled: "off"

gateway:
  api_server:
    enabled: true
    # Loopback by default; Docker sets API_SERVER_HOST=0.0.0.0 inside its private network.
    host: 127.0.0.1
    port: 8642
    model_name: waypoint-hermes
    max_concurrent_runs: 8
