# Dedicated email process: never mount Coach state, project plugins or skills here.
model:
  default: gemini-3.8-flash
  provider: gemini
  base_url: https://generativelanguage.googleapis.com/v1beta
platform_toolsets:
  api_server: []
plugins:
  enabled: []
  disabled: [farq]
memory:
  provider: builtin
  memory_enabled: false
  user_profile_enabled: false
agent:
  disabled_toolsets: [memory, skills, farq, terminal, browser, web]
  api_max_retries: 1
tools:
  tool_search:
    enabled: "off"
gateway:
  api_server:
    enabled: true
    host: 127.0.0.1
    port: 8643
    model_name: farq-email
    max_concurrent_runs: 2
